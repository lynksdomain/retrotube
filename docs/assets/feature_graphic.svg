<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <radialGradient id="glow" cx="230" cy="180" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#163430"/>
      <stop offset="100%" stop-color="#0B0B14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2FE6D0" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#2FE6D0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2FE6D0" stop-opacity="0.05"/>
